<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Los Santos Sheriff's Department — Records Management System. Système à accès restreint."
    />
    <link rel="icon" type="image/svg+xml" href="./brand/lssd-star.svg" />
    <title>LSSD RMS — Records Management System</title>

    <!-- Écran d'amorçage affiché avant l'hydratation de React (aucun flash blanc). -->
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0a0f1a;
        color: #e6edf7;
        font-family: 'Segoe UI', Inter, system-ui, sans-serif;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        letter-spacing: 0.18em;
        font-size: 12px;
        text-transform: uppercase;
        color: #8a9ab4;
        z-index: 9999;
        transition: opacity 220ms ease;
      }

      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-failure {
        display: none;
        max-width: 420px;
        text-align: center;
        line-height: 1.7;
        letter-spacing: 0.04em;
        text-transform: none;
        color: #c98a8a;
      }

      #boot.stalled .bar {
        display: none;
      }

      #boot.stalled #boot-failure {
        display: block;
      }

      #boot .bar {
        width: 240px;
        height: 2px;
        background: #142033;
        overflow: hidden;
      }

      #boot .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #2d7dd2;
        animation: boot-scan 1.1s ease-in-out infinite;
      }

      @keyframes boot-scan {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot">
      <div>Los Santos Sheriff's Department</div>
      <div class="bar"><span></span></div>
      <div id="boot-message">Initialisation du terminal</div>
      <div id="boot-failure">
        Le terminal n'a pas démarré. Vérifiez votre connexion réseau, puis
        rechargez la page. Si le problème persiste, videz le cache du navigateur
        (Ctrl + Maj + R).
      </div>
    </div>

    <script>
      /*
       * Filet de sécurité : le voile est retiré par React (cf. src/app/bootSplash.js).
       * S'il est toujours là au bout de 20 secondes, c'est que le bundle n'a pas
       * pu être chargé ou exécuté — un voile opaque et muet serait alors le pire
       * des retours possibles. On l'assume explicitement.
       */
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('hidden')) return;
        boot.classList.add('stalled');
        document.getElementById('boot-message').textContent = 'Échec du démarrage';
      }, 20000);
    </script>

    <noscript>
      <div style="padding: 32px; font-family: sans-serif">
        JavaScript est requis pour accéder au système LSSD RMS.
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
