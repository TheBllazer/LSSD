name: Déploiement GitHub Pages

# Construit et publie le terminal LSSD RMS sur GitHub Pages à chaque push
# sur la branche principale. Les clés Firebase sont injectées au build depuis
# les "Repository secrets" (Settings > Secrets and variables > Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les déploiements en attente sont annulés.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des sources
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse statique
        run: npm run lint

      - name: Build de production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          # Nom du dépôt = chemin de base sur github.io
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Publication de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Mise en ligne
        id: deployment
        uses: actions/deploy-pages@v4
